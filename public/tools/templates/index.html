<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Template Maker</title>
<style>
/* Fonts are shared with ARE Prep Tools (bundled, OFL licences in ../are/fonts/). */
@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(../are/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;src:url(../are/fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;src:url(../are/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(../are/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Spectral";font-weight:400;src:url(../are/fonts/spectral-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Spectral";font-weight:600;src:url(../are/fonts/spectral-latin-600-normal.woff2) format("woff2")}

/* E-ink: pure black on white, no animation, 52px targets. */
*{box-sizing:border-box;animation:none!important;transition:none!important}
:root{--ink:#000;--paper:#fff;--muted:#444;--gap:16px}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font:19px/1.4 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{min-height:52px;padding:0 16px;border:2px solid var(--ink);background:var(--paper);font-weight:600;border-radius:0;cursor:pointer}
button:active,button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button:disabled{opacity:.45}
a{color:inherit}

/* Shell: top and bottom bars never cover content; only the middle scrolls. */
.top{flex:none;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--ink);
  padding:max(8px,env(safe-area-inset-top)) 12px 8px}
.top h1{flex:1;margin:0;font-size:1.3rem}
.back{display:inline-flex;align-items:center;min-height:52px;padding:0 14px;border:2px solid var(--ink);text-decoration:none;font-weight:600}
.back:active{background:var(--ink);color:var(--paper)}
.middle{flex:1;min-height:0;display:flex;flex-direction:column}
.preview{flex:none;height:38vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px;border-bottom:2px solid var(--ink);background:#e6e6e6}
.paperbox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#preview{background:#fff;outline:2px solid var(--ink);display:block}
.dims{margin:8px 0 0;font-size:.8rem;font-family:"IBM Plex Mono",monospace}
.settings{flex:1;min-height:0;overflow-y:auto;padding:0 16px 24px}
@media (min-width:820px){
  .middle{flex-direction:row}
  .preview{height:auto;width:46%;border-bottom:0;border-right:2px solid var(--ink)}
  .settings{padding:0 24px 32px}
}
.bottom{flex:none;display:flex;align-items:center;gap:12px;border-top:3px solid var(--ink);
  padding:8px 12px max(8px,env(safe-area-inset-bottom))}
#status{flex:1;min-width:0;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#create{min-width:11em;background:var(--ink);color:var(--paper)}
#create:active{background:var(--paper);color:var(--ink)}

/* Settings */
.group{border-bottom:2px solid var(--ink);padding:18px 0}
.group:last-child{border-bottom:0}
.group>h2{margin:0 0 12px;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase}
.row{margin:0 0 16px}
.row:last-child{margin-bottom:0}
.row[hidden]{display:none}
.lab{display:block;font-weight:600;margin:0 0 6px}
.hint{display:block;font-size:.8rem;color:var(--muted);margin-top:6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;min-width:5.5em}
.seg.grid button{flex:1 1 calc(33% - 8px)}
input[type=text],textarea{width:100%;min-height:52px;padding:10px 12px;border:2px solid var(--ink);border-radius:0;background:var(--paper)}
textarea{min-height:140px;resize:vertical;font-family:"IBM Plex Mono",monospace;font-size:.95rem}
.stepper{display:flex;align-items:stretch;gap:0}
.stepper button{width:64px;font-size:1.4rem;padding:0}
.stepper output{flex:1;display:flex;align-items:center;justify-content:center;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);
  font-family:"IBM Plex Mono",monospace;font-weight:500;min-width:6em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.three .stepper button{width:48px}
.three .stepper output{min-width:3.5em}
.note{border:2px solid var(--ink);padding:12px;margin:0 0 12px;font-size:.9rem}
.note p{margin:0 0 10px}
.note p:last-child{margin:0}
.saved{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.saved-item{display:flex;gap:8px}
.saved-item .load{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-item .del{width:64px;padding:0}
.empty{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{flex:1 1 auto}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../../index.html">&larr; Tools</a>
  <h1>Template Maker</h1>
</header>

<div class="middle">
  <section class="preview" aria-label="Preview">
    <div class="paperbox" id="paperbox"><canvas id="preview" width="10" height="10"></canvas></div>
    <p class="dims" id="dims"></p>
  </section>
  <section class="settings" id="settings"></section>
</div>

<footer class="bottom">
  <div id="status">Set the notebook name, then create.</div>
  <button id="create">Create</button>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
