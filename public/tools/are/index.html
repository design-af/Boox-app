var SIZES = [16, 18, 20, 23, 26, 30];
/* Body type: serif (Spectral) or sans (IBM Plex Sans), three weights. "Heavier" thickens every
   glyph slightly with a text stroke, which also firms up the thin hairlines that e-ink loses. */
function typeStyle(face, w){
  var sans = face === "sans";
  return { font: sans ? "var(--sans)" : "var(--serif)",
    weight: String(w === 2 ? 600 : (w === 1 && sans) ? 500 : 400),
    stroke: w === 0 ? "0px" : "0.25px" };
}
var WEIGHTS = ["Regular", "Heavier", "Bold"];
function applySettings(){
  var s = prog.settings, r = document.documentElement;
  if(s.eink) r.setAttribute("data-eink", "on"); else r.removeAttribute("data-eink");
  if(s.theme === "light" || s.theme === "dark") r.setAttribute("data-theme", s.theme); else r.removeAttribute("data-theme");
  r.style.setProperty("--fs", SIZES[Math.max(0, Math.min(SIZES.length - 1, s.size))] + "px");
  var ty = typeStyle(s.face || "serif", s.weight || 0);
  r.style.setProperty("--body-font", ty.font); r.style.setProperty("--body-weight", ty.weight); r.style.setProperty("--stroke", ty.stroke);
}

/* ---------- starting runs ---------- */
function startQuiz(t){
  startRun({ title:t.title, crumb:"Quiz · " + t._div.code, kind:"quiz", mode:"feedback",
    back:{ v:"topic", d:t._div.id, t:t.id },
    items:(t.quiz||[]).map(function(q,i){ return { q:q, t:t, ref:{ d:t._div.id, src:"q", g:t.id, i:i } }; }) });
}
function startMock(d, n){
  var pool = shuffle(divPool(d).slice());
  n = Math.min(n, pool.length);
  startRun({ title:d.code + " practice exam", crumb:n + " items · timed", kind:"mock", mode:"exam",
    divId:d.id, minutes:Math.round(d.format.minutes / d.format.items * n),
    back:{ v:"div", d:d.id, tab:"mock" }, items:pool.slice(0, n) });
}
function startCase(d, cs){
  startRun({ title:cs.title, crumb:d.code + " case study", kind:"case", mode:"feedback",
    divId:d.id, caseId:cs.id, docs:cs.docs, minutes:cs.mins,
    back:{ v:"div", d:d.id, tab:"case" },
    items:cs.questions.map(function(q,i){
      var t = d.topics.filter(function(x){ return x.id === q.t; })[0] || d.topics[0];
      return { q:q, t:t, ref:{ d:d.id, src:"c", g:cs.id, i:i } };
    }) });
}
function startReview(limit){
  var list = missList();
  shuffle(list);
  if(limit) list = list.slice(0, limit);
  startRun({ title:"Review queue", crumb:list.length + " missed questions", kind:"review", mode:"feedback",
    back:{ v:"home" }, items:list.map(function(r){ return { q:r.q, t:r.t, ref:r.ref }; }) });
}


/* ---------- narration (HANDOFF §9) ----------
   Chapters read aloud page by page and mark themselves read when finished; flashcards run as a
   hands-free drill (prompt, think time, answer) that never touches the review schedule. On the
   tablet a native service plays the queue, so it carries on with the screen off. */
var NAR = window.ARE_NARRATOR || { available:false, engine:"none" };
var SP = window.ARE_SPEECH;
var LSN = "are5.narr", narr = null, narCheck = { ok:true };
var RATES = [0.7, 0.85, 1, 1.15, 1.3, 1.5, 1.75, 2];
function topicById(id){ for(var i=0;i<DIVS.length;i++){ var t = DIVS[i].topics.filter(function(x){ return x.id === id; })[0]; if(t) return t; } return null; }
function narrSave(){ try{ if(narr) localStorage.setItem(LSN, JSON.stringify(narr)); else localStorage.removeItem(LSN); }catch(e){} }
function narrLoad(){ try{ var o = JSON.parse(localStorage.getItem(LSN) || "null"); if(o && o.session && o.items) narr = o; }catch(e){} }
function narrLive(){ return !!(narr && (narr.state === "playing" || narr.state === "paused")); }
function narrItem(){ return narr && narr.items[Math.min(narr.index || 0, narr.items.length - 1)]; }
function narrFor(kind, t){ return !!(narr && narr.kind === kind && (!t || narr.t === t)); }
function narrRoute(){
  if(!narr) return { v:"home" };
  var t = topicById(narr.t);
  if(narr.kind === "chapter") return { v:"read", d:t ? t._div.id : "", t:narr.t, i:(narrItem() || {}).g || 0 };
  return { v:"drill", d:t ? t._div.id : "", t:narr.t, mode:narr.mode };
}
function narrFirst(g){ for(var k=0;k<narr.items.length;k++) if(narr.items[k].g >= g) return k; return narr.items.length - 1; }
function narrStart(meta, items, start, title){
  if(!NAR.available || !items.length) return;
  narr = meta;
  narr.session = "n" + Date.now();
  narr.items = items.map(function(it){ return { g:it.g, r:it.role, k:it.key || "" }; });
  narr.state = "playing"; narr.index = start || 0; narr.err = ""; narr.title = title;
  narrSave();
  function failed(err){ if(narr){ narr.state = "error"; narr.err = String(err && err.message || err); narrSave(); render(); } }
  try{
    NAR.play({ items:items.map(function(it){ return { text:it.text, pause:it.pause, label:it.label }; }),
      start:narr.index, session:narr.session, title:title, rate:prog.settings.rate || 1,
      voice:prog.settings.voice || "", engine:prog.settings.ttsEngine || "" }).then(onNar, failed);
  }catch(err){ failed(err); }
}
function listenChapter(t, page){
  var items = SP.chapterItems(t), start = 0;
  for(var k=0;k<items.length;k++) if(items[k].g >= (page || 0)){ start = k; break; }
  narrStart({ kind:"chapter", t:t.id }, items, start, t.title);
}
function drillCards(mode, t){
  if(mode === "due") return dueCards().map(function(x){ return [x.t.id, x.i]; });
  var p = tp(t.id), unknown = [], known = [];
  (t.cards||[]).forEach(function(c, i){ ((p.known||[]).indexOf(i) >= 0 ? known : unknown).push([t.id, i]); });
  return unknown.concat(known);
}
function listenDrill(mode, t){
  var refs = drillCards(mode, t);
  var cards = refs.map(function(r){ return topicById(r[0]).cards[r[1]]; });
  narrStart({ kind:"drill", mode:mode, t:t ? t.id : "", refs:refs }, SP.cardItems(cards, (prog.settings.gap || 5) * 1000),
    0, mode === "due" ? "Due cards, hands-free" : t.title + " cards");
}
function onNar(ev){
  if(!narr || !ev || (ev.session && ev.session !== narr.session)) return;
  var before = narrItem() || {}, was = narr.state;
  if(ev.state) narr.state = ev.state;
  if(typeof ev.index === "number" && ev.index >= 0) narr.index = Math.min(ev.index, narr.items.length - 1);
  if(ev.error) narr.err = ev.error;
  var now = narrItem() || {};
  if(narr.state === "done" && narr.kind === "chapter" && !narr.marked){
    narr.marked = true; touch(narr.t, function(p){ p.read = true; });
  }
  narrSave();
  /* Turn the page with the reading, but only if you were on the page being read — if you have
     browsed ahead or back, stay put and offer a button to jump to it instead. */
  var onIt = narr.kind === "chapter" && route.v === "read" && route.t === narr.t;
  if(onIt && now.g !== before.g && (route.i || 0) === before.g && now.g !== (route.i || 0)){
    route.i = now.g; toTop(); render(); return;
  }
  if(narr.state !== was) { render(); return; }
  if(onIt && now.g !== before.g) { document.getElementById("rail").innerHTML = railFor(); }
  if(narr.kind === "drill" && route.v === "drill" && (now.g !== before.g || now.r !== before.r)) { render(); return; }
  narrMark();
}
function narrMark(){
  var old = document.querySelectorAll(".read .speaking");
  var it = narrItem(), el = null;
  if(narr && narr.kind === "chapter" && narrLive() && route.v === "read" && route.t === narr.t && it && it.g === (route.i || 0) && it.k)
    el = document.querySelector('.read [data-sk="' + it.k + '"]');
  for(var i=0;i<old.length;i++) if(old[i] !== el) old[i].classList.remove("speaking");
  if(!el || el.classList.contains("speaking")) return;
  el.classList.add("speaking");
  var m = document.querySelector("main"), r = el.getBoundingClientRect(), mr = m.getBoundingClientRect();
  if(r.top < mr.top || r.bottom > mr.bottom) m.scrollTop += r.top - mr.top - 24;
}
function narrSync(){
  if(!narr || !NAR.available) return;
  NAR.state().then(function(s){
    if(!narr) return;
    if(s && s.session === narr.session) onNar(s);
    else if(narrLive()){ narr.state = "stopped"; narrSave(); render(); }
  }, function(){});
}
function narrCmd(cmd){
  if(!narr) return;
  var p = cmd === "pause" ? NAR.pause() : cmd === "resume" ? NAR.resume() : cmd === "stop" ? NAR.stop() : null;
  if(cmd === "prev" || cmd === "next"){
    var g = (narrItem() || {}).g || 0;
    var target = cmd === "next" ? narrFirst(g + 1) : narrFirst(Math.max(0, g - ((narrItem() || {}).r === "q" ? 1 : 0)));
    if(cmd === "next" && target <= narr.index) return;
    p = NAR.seek(target);
  }
  if(p) p.then(onNar, function(){});
}
function narrErrHTML(){
  if(!narr || narr.state !== "error") return "";
  var why = narr.err === "no-engine" ? "No text-to-speech engine is installed on this tablet. Install one from the app store (Google's Speech Services, for example), set it as the default under Android Settings → Text-to-speech output, then try again."
    : narr.err === "no-voice" ? "The text-to-speech engine has no English voice installed. Open its settings and download an English voice, then try again."
    : "The narrator could not start: " + narr.err;
  return '<div class="note"><b>Listening unavailable</b>' + esc(why) + "</div>";
}
function railNarr(){
  return '<button class="btn" data-listen="stop">Stop</button>'
    + (narr.kind === "drill" ? '<button class="btn" data-listen="prev">‹ Prev</button>' : "")
    + '<button class="btn btn-primary" data-listen="' + (narr.state === "playing" ? "pause" : "resume") + '">' + (narr.state === "playing" ? "Pause" : "Resume") + "</button>"
    + (narr.kind === "drill" ? '<button class="btn" data-listen="next">Next ›</button>' : "");
}
function vDrill(){
  var t = topicById(route.t);
  var mine = narr && narr.kind === "drill" && narr.mode === route.mode && (route.mode === "due" || narr.t === route.t);
  var title = route.mode === "due" ? "Due cards" : t ? t.title : "Cards";
  var crumb = "Hands-free drill";
  var intro = '<p class="small muted">Reads each prompt, waits ' + (prog.settings.gap || 5) + " seconds for you to answer in your head, then reads the answer. Your review schedule is not changed — grade cards in the normal deck when you want them to count.</p>";
  if(!mine || narr.state === "stopped" || narr.state === "error"){
    var n = drillCards(route.mode, t).length;
    return { title:title, crumb:crumb, html:(mine ? narrErrHTML() : "") + intro
      + (n ? '<div class="row" style="margin-top:14px"><button class="btn btn-primary" data-listen="drill-start">Start · ' + n + " card" + (n === 1 ? "" : "s") + "</button></div>"
        : "<p>No cards to drill right now.</p>") };
  }
  if(narr.state === "done"){
    return { title:title, crumb:crumb, html:'<div class="banner"><span class="eyebrow">Drill finished</span><span class="big num">' + narr.refs.length + '</span><p class="small" style="margin:10px 0 0">cards read through.</p></div>'
      + '<div class="row"><button class="btn btn-primary" data-listen="drill-start">Run it again</button></div>' };
  }
  var it = narrItem(), ref = narr.refs[it.g], c = topicById(ref[0]).cards[ref[1]];
  var h = '<div class="pcount" style="margin-bottom:8px">Card ' + (it.g + 1) + " of " + narr.refs.length + (narr.state === "paused" ? " · paused" : "") + "</div>"
    + '<div class="card"><span class="side">Prompt</span><span class="q">' + fmt(c.q) + "</span>"
    + (it.r === "a" ? '<span class="a">' + fmt(c.a) + "</span>" : "") + "</div>"
    + '<p class="tapcue">' + (it.r === "a" ? "Answer" : "Think of the answer…") + "</p>";
  return { title:title, crumb:crumb, html:h };
}

/* ---------- ink: pen, marker and eraser on chapter pages ----------
   Strokes are stored per chapter page in their own localStorage key, in units of 1/1000 of the
   page width, so they stay on the words they were drawn on when the screen rotates. Changing
   the text size reflows the words underneath, so ink drawn at one size sits best at that size. */
var LSI = "are5.ink", INKS = {}, inkOn = false, inkTool = "pen", inkUndo = [], inkCur = null, inkArmed = false;
try{ INKS = JSON.parse(localStorage.getItem(LSI) || "{}") || {}; }catch(e){ INKS = {}; }
function inkSave(){
  try{ localStorage.setItem(LSI, JSON.stringify(INKS)); }
  catch(e){ var el = document.getElementById("sync"); if(el) el.textContent = "Ink not saved — device storage is full"; }
}
function inkKey(){ return route.v === "read" && route.t ? route.t + ":" + (route.i || 0) : null; }
function inkD(p){
  if(!p.length) return "";
  var d = "M" + p[0] + " " + p[1];
  if(p.length === 2) return d + " l0.1 0";
  for(var i = 2; i < p.length; i += 2) d += " L" + p[i] + " " + p[i + 1];
  return d;
}
function inkPath(st){ return '<path class="' + (st.t === "hl" ? "ink-hl" : "ink-pen") + '" d="' + inkD(st.p) + '"/>'; }
/* Draw in a 1000-unit-wide space scaled by a plain transform, never by viewBox fitting, so a pen
   point always lands exactly under the pen whatever the layer's height. */
var inkScale = 1;
function inkLayout(){
  var w = document.getElementById("inkwrap"), svg = document.getElementById("inklayer");
  if(!w || !svg) return;
  var W = w.clientWidth || 1, H = w.scrollHeight || 1;
  inkScale = W / 1000;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.removeAttribute("viewBox");
  svg.style.height = H + "px";
  var g = svg.querySelector(".sc"); if(g) g.setAttribute("transform", "scale(" + inkScale + ")");
}
function inkDraw(){
  var svg = document.getElementById("inklayer"); if(!svg) return;
  var list = INKS[inkKey()] || [];
  svg.innerHTML = '<g class="sc" transform="scale(' + inkScale + ')"><g class="hl">' + list.filter(function(x){ return x.t === "hl"; }).map(inkPath).join("") + "</g>"
    + '<g class="pn">' + list.filter(function(x){ return x.t !== "hl"; }).map(inkPath).join("") + "</g></g>";
}
function inkRefresh(){ inkLayout(); inkDraw(); }
var inkPen = false;   // once a stylus is seen, fingers and palms no longer draw
function inkMode(on){
  inkOn = !!on && route.v === "read";
  document.body.classList.toggle("inking", inkOn);
  inkArmed = false; var c = document.querySelector('[data-ink="clear"]'); if(c) c.textContent = "Clear";
  inkTools();
}
function inkTools(){
  var bs = document.querySelectorAll("[data-ink]");
  for(var i = 0; i < bs.length; i++){
    var k = bs[i].getAttribute("data-ink");
    if(k === "pen" || k === "hl" || k === "erase") bs[i].setAttribute("aria-pressed", k === inkTool ? "true" : "false");
  }
}
function inkPt(e, r){
  var k = 1000 / (r.width || 1);
  return [Math.round((e.clientX - r.left) * k * 10) / 10, Math.round((e.clientY - r.top) * k * 10) / 10];
}
function inkErase(pt){
  var key = inkKey(), list = INKS[key] || [], gone = [];
  for(var i = list.length - 1; i >= 0; i--){
    var p = list[i].p, r = list[i].t === "hl" ? 22 : 14;
    for(var j = 0; j < p.length; j += 2){
      var dx = p[j] - pt[0], dy = p[j + 1] - pt[1];
      if(dx * dx + dy * dy < r * r){ gone.push({ i:i, s:list[i] }); list.splice(i, 1); break; }
    }
  }
  if(gone.length){ inkUndo.push({ k:key, removed:gone }); inkDraw(); }
  return gone.length;
}
document.addEventListener("pointerdown", function(e){
  if(!inkOn || e.target.closest("#inklayer") === null) return;
  e.preventDefault();
  if(e.pointerType === "pen") inkPen = true;
  else if(inkPen) return;                       // palm or finger while using the stylus: ignore
  if(inkCur){
    if(e.pointerType !== "pen") return;
    if(inkCur.el && inkCur.el.parentNode) inkCur.el.parentNode.removeChild(inkCur.el);   // a palm got there first
    inkCur = null;
  }
  var svg = document.getElementById("inklayer"), r = svg.getBoundingClientRect(), pt = inkPt(e, r);
  try{ svg.setPointerCapture(e.pointerId); }catch(err){}
  if(inkTool === "erase"){ inkCur = { erase:true, id:e.pointerId, hit:0, r:r }; inkCur.hit += inkErase(pt); return; }
  inkCur = { id:e.pointerId, r:r, st:{ t:inkTool, p:pt.slice() }, d:"", frame:0 };
  var g = svg.querySelector(inkTool === "hl" ? ".hl" : ".pn");
  g.insertAdjacentHTML("beforeend", inkPath(inkCur.st));
  inkCur.el = g.lastChild; inkCur.d = inkCur.el.getAttribute("d").replace(/ l0\.1 0$/, "");
}, { passive:false });
document.addEventListener("pointermove", function(e){
  if(!inkCur || e.pointerId !== inkCur.id) return;
  e.preventDefault();
  var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; if(!evs.length) evs = [e];
  for(var i = 0; i < evs.length; i++){
    var pt = inkPt(evs[i], inkCur.r);
    if(inkCur.erase){ inkCur.hit += inkErase(pt); continue; }
    var p = inkCur.st.p, lx = p[p.length - 2], ly = p[p.length - 1];
    if((pt[0] - lx) * (pt[0] - lx) + (pt[1] - ly) * (pt[1] - ly) < 4) continue;
    if(inkCur.st.t === "hl") pt[1] = p[1] + (pt[1] - p[1]) * 0.15;   // marker lines stay near level
    p.push(pt[0], pt[1]);
    inkCur.d += " L" + pt[0] + " " + pt[1];
  }
  /* one DOM update per frame, however many points arrived */
  if(!inkCur.erase && !inkCur.frame){
    var c = inkCur;
    c.frame = requestAnimationFrame(function(){ c.frame = 0; if(c.el) c.el.setAttribute("d", c.d); });
  }
}, { passive:false });
/* if the page scrolls mid-stroke, re-measure so points stay under the pen */
document.addEventListener("scroll", function(){ if(inkCur){ var svg = document.getElementById("inklayer"); if(svg) inkCur.r = svg.getBoundingClientRect(); } }, true);
function inkEnd(e){
  if(!inkCur || e.pointerId !== inkCur.id) return;
  var c = inkCur; inkCur = null;
  if(c.frame){ cancelAnimationFrame(c.frame); }
  if(c.el && !c.erase) c.el.setAttribute("d", inkD(c.st.p));
  if(c.erase){ if(c.hit) inkSave(); return; }
  var key = inkKey(); if(!key) return;
  (INKS[key] = INKS[key] || []).push(c.st);
  inkUndo.push({ k:key, added:c.st });
  inkSave();
}
document.addEventListener("pointerup", inkEnd);
document.addEventListener("pointercancel", inkEnd);
window.addEventListener("resize", function(){ if(route.v === "read") inkRefresh(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if(route.v === "read") inkRefresh(); });
function inkAction(a){
  if(a === "pen" || a === "hl" || a === "erase"){ inkTool = a; inkTools(); return; }
  if(a === "done"){ inkMode(false); return; }
  if(a === "undo"){
    var u = inkUndo.pop(); if(!u) return;
    var list = INKS[u.k] = INKS[u.k] || [];
    if(u.added){ var ix = list.indexOf(u.added); if(ix >= 0) list.splice(ix, 1); }
    if(u.removed) u.removed.slice().reverse().forEach(function(r){ list.splice(Math.min(r.i, list.length), 0, r.s); });
    if(u.cleared) INKS[u.k] = u.cleared;
    if(!INKS[u.k].length) delete INKS[u.k];
    inkSave(); inkDraw(); return;
  }
  if(a === "clear"){
    var key = inkKey(), b = document.querySelector('[data-ink="clear"]');
    if(!key || !(INKS[key] || []).length) return;
    if(!inkArmed){ inkArmed = true; if(b) b.textContent = "Tap to clear page"; return; }
    inkUndo.push({ k:key, cleared:INKS[key] }); delete INKS[key]; inkSave(); inkDraw();
    inkArmed = false; if(b) b.textContent = "Clear";
  }
}

/* ---------- readability test ---------- */
function vReadTest(){
  var s = prog.settings, fs = SIZES[Math.max(0, Math.min(SIZES.length - 1, s.size))];
  var dpr = window.devicePixelRatio || 1, pt = fs * dpr / 300 * 72;
  var t = DIVS[0].topics[0], b = (t.read || [])[0] || {}, para = (b.p || [])[0] || t.summary;
  var h = '<p class="small muted">Each box shows the same passage at your current text size (' + fs + "px). Read them at your normal distance, in your usual light, and tap <b>Use</b> on the one that reads most easily. Change the size with A− / A+.</p>"
    + '<div class="row" style="align-items:center"><button class="btn btn-sm" data-size="-1">A−</button><button class="btn btn-sm" data-size="1">A+</button>'
    + '<span class="small muted num">Screen ' + window.innerWidth + "×" + window.innerHeight + " at " + dpr.toFixed(2) + "× · body text ≈ " + pt.toFixed(1) + " pt on a 300 ppi panel (a printed book is about 10–12 pt)</span></div>";
  var n = 0;
  ["serif", "sans"].forEach(function(face){
    [0, 1, 2].forEach(function(w){
      n++;
      var ty = typeStyle(face, w), on = (s.face || "serif") === face && (s.weight || 0) === w;
      var st = "font-family:" + ty.font + ";font-weight:" + ty.weight + ";-webkit-text-stroke:" + ty.stroke + " currentColor";
      h += '<div class="rt" data-on="' + (on ? 1 : 0) + '"><div class="rth"><span>' + n + " · " + (face === "sans" ? "Sans" : "Serif") + " · " + WEIGHTS[w] + (on ? " (current)" : "") + "</span>"
        + '<button class="btn btn-sm' + (on ? " btn-primary" : "") + '" data-type="pick" data-face="' + face + '" data-w="' + w + '">' + (on ? "✓ In use" : "Use") + "</button></div>"
        + '<div style="' + st + '"><p>' + fmt(para) + "</p>"
        + '<p class="small" style="margin:0">B101 · A201 §4.2 · 1½ hr · 16–18″ · ±10–15% · R-13 · Type V-B</p>'
        + '<span class="eyebrow">Small label · 12 of 40 recalled</span></div></div>';
    });
  });
  return { title:"Readability test", crumb:"Settings · Display", html:h };
}

/* ---------- voice picker ---------- */
var voiceInfo = null, voiceLoading = false;
var SAMPLE = "Under B101, the architect does not warrant the cost estimate. A 2-hour fire barrier takes a 1½ hr door, and a ramp may be no steeper than 1:12.";
function voiceLabel(v){
  var m = /-x-([a-z]{3})-/.exec(v.name || "");
  return m ? "Voice " + m[1].toUpperCase() : (v.label || v.name);
}
function voiceTags(v){
  var t = [];
  t.push(v.network ? "needs internet" : "on device");
  if(v.quality >= 500) t.push("very high quality"); else if(v.quality >= 400) t.push("high quality");
  if(!v.installed) t.push("not downloaded yet");
  return t.join(" · ");
}
function voiceName(){
  var n = prog.settings.voice;
  if(!n) return "System default";
  var v = voiceInfo && voiceInfo.voices.filter(function(x){ return x.name === n; })[0];
  return v ? voiceLabel(v) + " · " + v.localeLabel : n;
}
function loadVoices(){
  if(voiceLoading || !NAR.available) return;
  voiceLoading = true;
  NAR.voices(prog.settings.ttsEngine || "").then(function(r){ voiceInfo = r || { voices:[], engines:[] }; voiceLoading = false; if(route.v === "voices" || route.v === "settings") render(); },
    function(){ voiceInfo = { ok:false, voices:[], engines:[] }; voiceLoading = false; if(route.v === "voices") render(); });
}
function vVoices(){
  if(!voiceInfo){ loadVoices(); return { title:"Voice", crumb:"Settings", html:'<p class="muted">Looking for voices…</p>' }; }
  var s = prog.settings, h = "";
  h += '<p class="small muted">Tap <b>Try</b> to hear a sample read at your current speed, then <b>Use</b> to pick it. Voices marked “needs internet” stop when the tablet is offline.</p>';
  if(NAR.engine === "native"){
    var cur = s.ttsEngine || voiceInfo.defaultEngine || "";
    if((voiceInfo.engines || []).length){
      h += '<h3 style="margin:18px 0 8px">Speech engine</h3><div class="row">';
      voiceInfo.engines.forEach(function(e){
        h += '<button class="btn btn-sm' + (e.name === cur ? " btn-primary" : "") + '" data-voice="engine" data-name="' + esc(e.name) + '">' + esc(e.label) + "</button>";
      });
      h += "</div>";
    }
    h += '<div class="row" style="margin-top:10px"><button class="btn btn-sm" data-voice="settings">Android speech settings</button>'
      + '<button class="btn btn-sm" data-voice="reload">Refresh list</button></div>'
      + '<p class="small muted" style="margin-top:6px">Install another engine from the app store and it appears here. Use Android speech settings to download voice data.</p>';
  }
  var list = (voiceInfo.voices || []).slice().sort(function(a, b){
    return (b.installed - a.installed) || (a.network - b.network) || (b.quality - a.quality) || voiceLabel(a).localeCompare(voiceLabel(b));
  });
  var order = ["en-US", "en-GB"], groups = {}, keys = [];
  list.forEach(function(v){ var g = v.localeLabel || v.locale; if(!groups[g]){ groups[g] = []; keys.push(g); } groups[g].push(v); });
  keys.sort(function(a, b){
    function rank(k){ var v = groups[k][0], i = order.indexOf(v.locale); return i < 0 ? 9 : i; }
    return rank(a) - rank(b) || a.localeCompare(b);
  });
  h += '<div class="vlist">';
  h += '<h3 style="margin:22px 0 6px">Default</h3><div class="kv"><span><span class="vname">System default</span><span class="vtags">whatever the engine is set to use</span></span>'
    + '<span class="row" style="flex-wrap:nowrap"><button class="btn btn-sm" data-voice="try" data-name="">▶ Try</button>'
    + '<button class="btn btn-sm' + (!s.voice ? " btn-primary" : "") + '" data-voice="use" data-name="">' + (!s.voice ? "✓ In use" : "Use") + "</button></span></div>";
  if(!list.length) h += '<p class="small muted" style="margin-top:14px">This engine did not report any English voices.</p>';
  keys.forEach(function(k){
    h += '<h3 style="margin:22px 0 6px">' + esc(k) + "</h3>";
    groups[k].forEach(function(v){
      var on = s.voice === v.name;
      h += '<div class="kv"><span><span class="vname">' + esc(voiceLabel(v)) + '</span><span class="vtags">' + esc(voiceTags(v)) + "</span></span>"
        + '<span class="row" style="flex-wrap:nowrap"><button class="btn btn-sm" data-voice="try" data-name="' + esc(v.name) + '">▶ Try</button>'
        + '<button class="btn btn-sm' + (on ? " btn-primary" : "") + '" data-voice="use" data-name="' + esc(v.name) + '">' + (on ? "✓ In use" : "Use") + "</button></span></div>";
    });
  });
  h += "</div>";
  return { title:"Voice", crumb:"Settings · Listening", html:h };
}

/* ---------- back navigation (on-screen button and Android back key) ---------- */
function goBack(){
  var v = route.v;
  if(inkOn){ inkMode(false); return; }
  if(v === "home"){ location.href = "../../index.html"; return; }
  if(v === "topic") go({ v:"div", d:route.d });
  else if(v === "read" || v === "cards") go({ v:"topic", d:route.d, t:route.t });
  else if(v === "drill") go(route.mode === "due" ? { v:"due" } : { v:"topic", d:route.d, t:route.t });
  else if(v === "readtest") go({ v:"settings" });
  else if(v === "voices"){ if(NAR.available) NAR.stopPreview().catch(function(){}); go({ v:"settings" }); }
  else if(v === "run" && run){ if(run.view !== "q"){ run.view = "q"; render(); } else go(run.back || { v:"home" }); }
  else go({ v:"home" });
}
/* Capacitor injects its bridge into every page it serves, but Capacitor.Plugins is only filled
   in by @capacitor/core, which this page does not load — so listen through the raw bridge. */
try{
  var Cap = window.Capacitor;
  if(Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.addListener){
    Cap.addListener("App", "backButton", function(){ goBack(); });
    Cap.addListener("App", "resume", function(){ narrSync(); });
  }
}catch(e){}
document.addEventListener("visibilitychange", function(){ if(!document.hidden) narrSync(); });

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest(
    "[data-go],[data-tab],[data-page],[data-done],[data-pick],[data-multi],[data-item],[data-target],[data-check],[data-rnext],[data-rnav],[data-grade],[data-restart],[data-conf],[data-set],[data-size],[data-io],[data-mock],[data-case],[data-review],[data-again],[data-docs],[data-doc],[data-resume],[data-zone],[data-pass],[data-move],[data-seqreset],[data-listen],[data-nset],[data-voice],[data-type],[data-ink],#inkbtn,#flip,#back,#gear,#find") : null;
  if(!el) return;

  if(el.id === "back"){ goBack(); return; }
  if(el.id === "inkbtn"){ inkMode(!inkOn); return; }
  if(el.hasAttribute("data-ink")){ inkAction(el.getAttribute("data-ink")); return; }
  if(el.id === "gear"){ go({ v:"settings" }); return; }
  if(el.id === "find"){ go({ v:"search" }); return; }
  if(el.id === "flip"){ cstate.flipped = !cstate.flipped; render(); return; }

  var g = el.getAttribute("data-go");
  if(g){ var r = JSON.parse(g); if(r.v === "cards") cstate = null;
    if(r.v === "quiz"){ var tq = byId[r.d].topics.filter(function(x){ return x.id === r.t; })[0]; startQuiz(tq); return; }
    go(r); return; }

  if(el.hasAttribute("data-resume")){
    var cd = currentDiv();
    var w = weakest(cd || undefined); if(!w) return;
    var na = nextAction(w);
    if(na.v === "quiz"){ startQuiz(w); return; }
    go({ v:na.v, d:w._div.id, t:w.id }); return;
  }
  if(el.hasAttribute("data-pass")){
    var pid = el.getAttribute("data-pass");
    if(prog.passed[pid]) delete prog.passed[pid]; else prog.passed[pid] = Date.now();
    saveLocal(); queuePush(); render(); return;
  }
  if(el.hasAttribute("data-move")){
    var mid = el.getAttribute("data-move"), dir = parseInt(el.getAttribute("data-dir"),10);
    var cur2 = seqList(), from = cur2.indexOf(mid), to = from + dir;
    if(from >= 0 && to >= 0 && to < cur2.length){
      cur2.splice(to, 0, cur2.splice(from, 1)[0]);
      prog.seq = cur2; saveLocal(); queuePush(); render();
    }
    return;
  }
  if(el.hasAttribute("data-seqreset")){ prog.seq = ORDER.slice(); saveLocal(); queuePush(); render(); return; }
  if(el.hasAttribute("data-tab")){
    if(route.v === "extras") go({ v:"extras", g:el.getAttribute("data-tab") });
    else go({ v:"div", d:route.d, tab:el.getAttribute("data-tab") });
    return;
  }
  if(el.hasAttribute("data-page")){ route.i = parseInt(el.getAttribute("data-page"), 10); toTop(); render(); return; }
  if(el.hasAttribute("data-listen")){
    var la = el.getAttribute("data-listen");
    if(la === "chapter"){ var lt = topicOf(route); if(lt){ listenChapter(lt, route.v === "read" ? (route.i || 0) : 0); if(route.v !== "read") go({ v:"read", d:route.d, t:route.t, i:0 }); else render(); } }
    else if(la === "drill-start"){ listenDrill(route.mode, topicById(route.t)); render(); }
    else if(la === "goto"){ go(narrRoute()); }
    else if(la === "jump"){ route.i = (narrItem() || {}).g || 0; toTop(); render(); }
    else if(la === "here"){ var hi = narrFirst(route.i || 0); var hp = narr.state === "playing" ? NAR.seek(hi) : NAR.seek(hi).then(function(){ return NAR.resume(); }); hp.then(onNar, function(){}); }
    else narrCmd(la);
    return;
  }
  if(el.hasAttribute("data-type")){
    var tk = el.getAttribute("data-type");
    if(tk === "face") prog.settings.face = (prog.settings.face || "serif") === "sans" ? "serif" : "sans";
    if(tk === "weight") prog.settings.weight = ((prog.settings.weight || 0) + 1) % 3;
    if(tk === "pick"){ prog.settings.face = el.getAttribute("data-face"); prog.settings.weight = parseInt(el.getAttribute("data-w"), 10); }
    saveLocal(); applySettings(); render(); return;
  }
  if(el.hasAttribute("data-voice")){
    var va = el.getAttribute("data-voice"), vn = el.getAttribute("data-name") || "";
    if(va === "try") NAR.preview({ text:SP.speak(SAMPLE), voice:vn, engine:prog.settings.ttsEngine || "", rate:prog.settings.rate || 1 }).catch(function(){});
    if(va === "use"){ prog.settings.voice = vn; saveLocal(); render(); }
    if(va === "engine"){ prog.settings.ttsEngine = vn; prog.settings.voice = ""; saveLocal(); voiceInfo = null; render(); }
    if(va === "settings") NAR.openSettings().catch(function(){});
    if(va === "reload"){ voiceInfo = null; render(); }
    return;
  }
  if(el.hasAttribute("data-nset")){
    var nk = el.getAttribute("data-nset"), by = parseInt(el.getAttribute("data-by"), 10);
    if(nk === "rate"){
      var ri = RATES.indexOf(prog.settings.rate || 1); if(ri < 0) ri = 2;
      prog.settings.rate = RATES[Math.max(0, Math.min(RATES.length - 1, ri + by))];
      if(NAR.available && narrLive()) NAR.setRate(prog.settings.rate).then(onNar, function(){});
    } else prog.settings.gap = Math.max(2, Math.min(15, (prog.settings.gap || 5) + by));
    saveLocal(); render(); return;
  }
  if(el.getAttribute("data-done") === "read"){ touch(route.t, function(p){ p.read = true; }); go({ v:"topic", d:route.d, t:route.t }); return; }
  if(el.hasAttribute("data-conf")){
    var c = parseInt(el.getAttribute("data-conf"), 10);
    touch(route.t, function(p){ p.conf = (p.conf === c ? 0 : c); });
    render(); return;
  }
  if(el.hasAttribute("data-grade")){
    var holder = el.parentNode;
    schedule(holder.getAttribute("data-topic"), parseInt(holder.getAttribute("data-idx"),10), parseInt(el.getAttribute("data-grade"),10));
    cstate.pos++; cstate.flipped = false; toTop(); render(); return;
  }
  if(el.hasAttribute("data-restart")){ cstate = null; toTop(); render(); return; }

  /* answering */
  if(run && !run.done && el.hasAttribute("data-pick")){
    if(run.checked[run.i]) return;
    run.answers[run.i] = parseInt(el.getAttribute("data-pick"), 10);
    if(run.mode === "exam"){ render(); } else { render(); }
    return;
  }
  if(run && !run.done && el.hasAttribute("data-multi")){
    if(run.checked[run.i]) return;
    var mi = parseInt(el.getAttribute("data-multi"), 10);
    var arr = run.answers[run.i] || [];
    var at = arr.indexOf(mi);
    if(at >= 0) arr.splice(at,1); else arr.push(mi);
    run.answers[run.i] = arr; render(); return;
  }
  if(run && !run.done && el.hasAttribute("data-zone")){
    if(run.checked[run.i]) return;
    run.answers[run.i] = el.getAttribute("data-zone");
    paintHot(run.items[run.i].q, run.answers[run.i], false);
    var cb = document.querySelector("[data-check]"); if(cb) cb.disabled = false;
    return;
  }
  if(run && !run.done && el.hasAttribute("data-item")){
    if(run.checked[run.i]) return;
    run.sel = parseInt(el.getAttribute("data-item"), 10);
    var chips = document.querySelectorAll("[data-item]");
    for(var ci=0;ci<chips.length;ci++) chips[ci].setAttribute("aria-pressed", chips[ci] === el ? "true" : "false");
    return;
  }
  if(run && !run.done && el.hasAttribute("data-target")){
    if(run.checked[run.i]) return;
    var ti = parseInt(el.getAttribute("data-target"), 10);
    var q = run.items[run.i].q;
    var cur = run.answers[run.i] || q.targets.map(function(){ return null; });
    if(cur[ti] != null && run.sel === null){ cur[ti] = null; }
    else if(run.sel !== null){
      for(var z=0;z<cur.length;z++) if(cur[z] === run.sel) cur[z] = null;
      cur[ti] = run.sel; run.sel = null;
    }
    run.answers[run.i] = cur; render(); return;
  }
  if(run && el.hasAttribute("data-check")){
    var qq = run.items[run.i].q;
    if(kindOf(qq) === "num"){ var ii = document.getElementById("numin"); if(ii) run.answers[run.i] = ii.value; }
    if(!answered(qq, run.answers[run.i])) return;
    run.checked[run.i] = true;
    if(run.items[run.i].ref){
      if(isRight(qq, run.answers[run.i])) clearMiss(run.items[run.i].ref); else addMiss(run.items[run.i].ref);
    }
    render(); return;
  }
  if(run && el.hasAttribute("data-rnext")){
    if(run.mode === "exam" && kindOf(run.items[run.i].q) === "num"){
      var i2 = document.getElementById("numin"); if(i2) run.answers[run.i] = i2.value;
    }
    if(run.i === run.items.length - 1){ finishRun(); }
    else { run.i++; run.sel = null; }
    toTop(); render(); return;
  }
  if(run && el.hasAttribute("data-rnav")){
    if(kindOf(run.items[run.i].q) === "num"){ var i3 = document.getElementById("numin"); if(i3) run.answers[run.i] = i3.value; }
    run.i = Math.max(0, Math.min(run.items.length-1, run.i + parseInt(el.getAttribute("data-rnav"),10)));
    run.sel = null; toTop(); render(); return;
  }
  if(el.hasAttribute("data-docs")){ run.view = "docs"; toTop(); render(); return; }
  if(el.hasAttribute("data-doc")){
    var dv = el.getAttribute("data-doc");
    run.view = dv === "back" ? "q" : dv === "list" ? "docs" : "doc:" + dv;
    toTop(); render(); return;
  }
  if(el.hasAttribute("data-again")){
    if(run.kind === "mock") startMock(byId[run.divId], run.items.length);
    else if(run.kind === "case") startCase(byId[run.divId], byId[run.divId].cases.filter(function(c){ return c.id === run.caseId; })[0]);
    else if(run.kind === "review") startReview(0);
    else { run.i = 0; run.done = false; run.answers = run.items.map(function(){ return null; }); run.checked = run.items.map(function(){ return false; }); render(); }
    return;
  }
  if(el.hasAttribute("data-mock")){ startMock(byId[el.getAttribute("data-mock")], parseInt(el.getAttribute("data-n"),10)); return; }
  if(el.hasAttribute("data-case")){
    var cid = el.getAttribute("data-case");
    var dd = DIVS.filter(function(x){ return x.cases.some(function(c){ return c.id === cid; }); })[0];
    if(dd) startCase(dd, dd.cases.filter(function(c){ return c.id === cid; })[0]);
    return;
  }
  if(el.hasAttribute("data-review")){
    var lim = el.getAttribute("data-review");
    startReview(lim === "all" ? 0 : parseInt(lim,10)); return;
  }

  if(el.hasAttribute("data-set")){
    var k = el.getAttribute("data-set");
    if(k === "eink") prog.settings.eink = !prog.settings.eink;
    if(k === "theme") prog.settings.theme = prog.settings.theme === "system" ? "light" : prog.settings.theme === "light" ? "dark" : "system";
    saveLocal(); applySettings(); render(); return;
  }
  if(el.hasAttribute("data-size")){
    prog.settings.size = Math.max(0, Math.min(SIZES.length - 1, (prog.settings.size == null ? 1 : prog.settings.size) + parseInt(el.getAttribute("data-size"), 10)));
    saveLocal(); applySettings(); if(route.v === "settings" || route.v === "readtest") render(); if(route.v === "read") inkRefresh(); return;
  }
  if(el.hasAttribute("data-io")){
    var act = el.getAttribute("data-io"), box = document.getElementById("io"), msg = document.getElementById("iomsg");
    if(act === "export"){ box.value = JSON.stringify({ topics:prog.topics, mocks:prog.mocks, misses:prog.misses, cases:prog.cases, seq:prog.seq, passed:prog.passed, ink:INKS });
      msg.textContent = "Copied into the box. Select it all and paste it on the other tablet."; }
    if(act === "import"){
      try{ var imp = JSON.parse(box.value); mergeRemote(imp);
        if(imp && imp.ink && typeof imp.ink === "object"){ Object.keys(imp.ink).forEach(function(k){ if(Array.isArray(imp.ink[k]) && !(INKS[k] || []).length) INKS[k] = imp.ink[k]; }); inkSave(); }
        queuePush(); msg.textContent = "Merged. Anything newer in the box won."; render(); }
      catch(err){ msg.textContent = "That is not valid progress data — paste the whole box, including the braces."; }
    }
    if(act === "reset"){
      if(el.getAttribute("data-armed") === "1"){
        prog.topics = {}; prog.mocks = {}; prog.misses = {}; prog.cases = {}; prog.passed = {}; saveLocal(); queuePush(); render();
      } else {
        el.setAttribute("data-armed", "1"); el.textContent = "Tap again to erase";
        msg.textContent = "This clears every topic, card, quiz, case study, practice exam and passed division on all your devices. Your exam order is kept.";
      }
      return;
    }
    return;
  }
});

/* ---------- boot ---------- */
loadLocal();
applySettings();
narrLoad();
if(NAR.available){
  NAR.on(onNar);
  NAR.check().then(function(r){ narCheck = r || { ok:true }; if(route.v === "settings") render(); }, function(){});
  if(narr) narrSync();
} else narr = null;
var h0 = (location.hash || "").replace("#", "");
if(byId[h0]) route = { v:"div", d:h0 };
render();
startSync();
})();
</script>
