<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AFS Custom Boox</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="update-banner" hidden>
      <span id="update-text"></span>
      <button id="update-btn">Update</button>
    </div>

    <main>
      <h1>AFS Custom Boox</h1>
      <p class="muted">Tools built for the Boox Air 6C. Tap one to open it.</p>

      <nav class="tools" aria-label="Tools">
        <!-- Each tool lives in public/tools/<name>/ and is copied into the APK as-is. -->
        <a class="tool" href="tools/are/index.html">
          <span class="tool-code">ARE</span>
          <span class="tool-meta">
            <span class="tool-name">ARE Prep Tools</span>
            <span class="tool-sub">All six ARE 5.0 divisions: chapters, flashcards, quizzes, case studies and timed practice exams.</span>
          </span>
          <span class="tool-go" aria-hidden="true">&rarr;</span>
        </a>
      </nav>

      <section class="card">
        <h2>This app</h2>
        <p id="version">…</p>
        <button id="check-btn">Check for updates</button>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
